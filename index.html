<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }
    #game {
      max-width: 580px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }
    /* HEADER */
    .header { text-align: center; margin-bottom: 1.5rem; }
    .day-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title { font-size: 28px; font-weight: 700; color: #111; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; color: #888; margin-top: 5px; }

    /* EMOJI SCALE */
    .temp-scale {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 1.25rem 0;
      font-size: 22px;
    }
    .temp-scale span {
      opacity: 0.25;
      transition: opacity 0.4s, transform 0.4s;
      display: inline-block;
      cursor: default;
    }
    .temp-scale span.active { opacity: 1; transform: scale(1.6); }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1rem; }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e8e8e8;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-val { font-size: 22px; font-weight: 700; color: #111; margin-top: 2px; }

    /* ERROR */
    .error-msg { font-size: 13px; color: #c0392b; margin-bottom: 6px; min-height: 18px; }

    /* INPUT */
    .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .autocomplete { position: relative; flex: 1; }
    .autocomplete input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #111;
      outline: none;
      transition: border-color 0.2s;
    }
    .autocomplete input:focus { border-color: #111; }
    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      z-index: 100;
      overflow: hidden;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .dropdown div {
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown div:hover { background: #f5f5f0; }
    .dropdown .dc { font-size: 11px; color: #999; }
    .guess-btn {
      padding: 11px 22px;
      border-radius: 10px;
      border: 1.5px solid #111;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .guess-btn:hover { background: #333; }

    /* HINT */
    .hint-box {
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 1rem;
      font-size: 13px;
      color: #666;
      border-left: 3px solid #f39c12;
    }
    .hint-box strong { color: #111; }

    /* GUESSES */
    .guesses-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 1rem; }
    .guess-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e8e8e8;
      background: #fff;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
    .guess-emoji { font-size: 24px; min-width: 34px; text-align: center; }
    .guess-name { flex: 1; font-size: 14px; font-weight: 600; color: #111; }
    .guess-country { font-size: 11px; color: #999; font-weight: 400; display: block; margin-top: 1px; }
    .guess-pct { font-size: 13px; color: #888; min-width: 38px; text-align: right; font-weight: 500; }

    /* WIN */
    .win-box {
      background: #fff;
      border-radius: 14px;
      padding: 1.75rem;
      text-align: center;
      border: 1px solid #e8e8e8;
      margin-top: 8px;
    }
    .win-title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .win-sub { font-size: 13px; color: #888; }
    .emoji-trail { font-size: 22px; margin: 12px 0; letter-spacing: 3px; word-break: break-all; }
    .share-row { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .share-btn {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid #111;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .share-btn:hover { background: #333; }
    .copied-msg { font-size: 12px; color: #27ae60; margin-top: 8px; min-height: 16px; }

    /* FOOTER */
    .footer { text-align: center; margin-top: 2rem; font-size: 12px; color: #bbb; }
  </style>
</head>

</div>

// Remove duplicates by name
const seen = new Set();
const PLAYERS = CRICKETERS.filter(c => { if(seen.has(c.name)){return false;} seen.add(c.name); return true; });

const DAY_STAMP = Math.floor(new Date().getTime() / 86400000);
const STORAGE_KEY = "cricket-hot-cold:daily-state:v1";

function getTodayIndex() {
  return DAY_STAMP % PLAYERS.length;
}
const SECRET = PLAYERS[getTodayIndex()];
const DAY_NUM = DAY_STAMP % 9999;

document.getElementById("dayBadge").textContent = "🏏 Cricket Hot & Cold #" + DAY_NUM;

let guesses = [], won = false;

const EMOJIS   = ["🧊","🌬️","💧","☀️","🌶️","🔥","🌋"];
const TRAIL_EMOJIS = ["⬛","🟦","🟦","🟨","🟨","🟧","🟥"];

function getEmojiIdx(score) {
  if (score >= 96) return 6;
  if (score >= 80) return 5;
  if (score >= 65) return 4;
  if (score >= 50) return 3;
  if (score >= 35) return 2;
  if (score >= 20) return 1;
  return 0;
}

function similarity(a, b) {
  let score = 0;
  if (a.country === b.country) score += 38;
  if (a.role === b.role) score += 22;
  if (a.era === b.era) score += 14;
  if (a.batting === b.batting) score += 8;
  const fmt = x => x === "all" ? ["test","odi","t20"] : [x];
  if (fmt(a.format).some(f => fmt(b.format).includes(f))) score += 8;
  if (Math.abs(a.runs - b.runs) < 5000) score += 5;
  if (Math.abs(a.wickets - b.wickets) < 150) score += 5;
  return Math.min(score, 99);
}

function buildGuess(player) {
  const isCorrect = player.name === SECRET.name;
  return {
    name: player.name,
    country: player.country,
    sim: isCorrect ? 100 : similarity(player, SECRET),
    isCorrect,
  };
}

function saveGame() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dayStamp: DAY_STAMP,
      secret: SECRET.name,
      guesses: guesses.map(g => g.name),
      won,
    }));
  } catch (err) {
    // Some browsers disable storage in private or locked-down contexts.
  }
}

function loadGame() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (err) {
    return;
  }

  if (!saved || saved.dayStamp !== DAY_STAMP || saved.secret !== SECRET.name || !Array.isArray(saved.guesses)) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
    return;
  }

  const restoredNames = new Set();
  guesses = saved.guesses.reduce((restored, name) => {
    const player = PLAYERS.find(c => c.name === name);
    if (!player || restoredNames.has(player.name)) return restored;
    restoredNames.add(player.name);
    restored.push(buildGuess(player));
    return restored;
  }, []);

  won = guesses.some(g => g.isCorrect);
  if (guesses.length) render();
  if (won) showWin();
}

function makeGuess() {
  if (won) return;
  const input = document.getElementById("guessInput");
  const val = input.value.trim();
  const err = document.getElementById("errMsg");
  err.textContent = "";
  if (!val) return;
  const found = PLAYERS.find(c => c.name.toLowerCase() === val.toLowerCase());
  if (!found) { err.textContent = "Cricketer not found. Use the autocomplete suggestions."; return; }
  if (guesses.find(g => g.name.toLowerCase() === found.name.toLowerCase())) {
    err.textContent = "Already guessed! Try a different cricketer."; return;
  }
  const guess = buildGuess(found);
  guesses.unshift(guess);
  input.value = "";
  document.getElementById("dropdown").style.display = "none";
  render();
  if (guess.isCorrect) showWin();
  saveGame();
}

function render() {
  document.getElementById("guessCount").textContent = guesses.length;
  const best = guesses.reduce((mx, g) => Math.max(mx, g.sim), 0);
  document.getElementById("bestScore").textContent = best + "%";
  const latest = guesses[0];
  const eidx = latest ? getEmojiIdx(latest.sim) : 0;
  document.getElementById("tempDisplay").textContent = latest ? EMOJIS[eidx] : "🧊";
  document.querySelectorAll("#tempScale span").forEach((s, i) => s.className = i === eidx && latest ? "active" : "");
  document.getElementById("guessList").innerHTML = guesses.map(g => {
    if (g.isCorrect) return `<div class="guess-row"><span class="guess-emoji">✅</span><div class="guess-name">${g.name}<span class="guess-country">${g.country}</span></div><span class="guess-pct">100%</span></div>`;
    const ei = getEmojiIdx(g.sim);
    return `<div class="guess-row"><span class="guess-emoji">${EMOJIS[ei]}</span><div class="guess-name">${g.name}<span class="guess-country">${g.country}</span></div><span class="guess-pct">${g.sim}%</span></div>`;
  }).join("");
  updateHint();
}

function updateHint() {
  const hints = [
    "A famous international cricketer is hiding here...",
    `This cricketer is from <strong>${SECRET.country}</strong>.`,
    `Role: <strong>${SECRET.role}</strong>.`,
    `Era: <strong>${SECRET.era === "legend" ? "Legendary — retired or hall of fame" : "Current generation"}</strong>.`,
    `Bats: <strong>${SECRET.batting}-handed</strong>.`,
  ];
  const idx = Math.min(Math.floor(guesses.length / 3), hints.length - 1);
  document.getElementById("hintBox").innerHTML = `<strong>💡 Hint:</strong> ${hints[idx]}`;
}

function getTrail() {
  return guesses.map(g => {
    if (g.isCorrect) return "🟩";
    return TRAIL_EMOJIS[getEmojiIdx(g.sim)];
  }).reverse().join("");
}

function showWin() {
  won = true;
  document.getElementById("winBox").innerHTML = `
    <div class="win-box">
      <div style="font-size:36px;margin-bottom:8px;">🏆</div>
      <div class="win-title">You got it — ${SECRET.name}!</div>
      <div class="win-sub">Solved in ${guesses.length} guess${guesses.length===1?"":"es"} • ${SECRET.country}</div>
      <div class="emoji-trail">${getTrail()}</div>
      <div class="copied-msg" id="copiedMsg"></div>
      <div class="share-row">
        <button class="share-btn" onclick="shareResult()">📋 Copy result for Reddit</button>
      </div>
    </div>`;
}

function shareResult() {
  const text = `🏏 Cricket Hot & Cold #${DAY_NUM}\nI guessed ${SECRET.name} in ${guesses.length} tries!\n${getTrail()}\nScale: ⬛🟦🟨🟧🟥🟩\nPlay at: yourcricketgame.vercel.app`;
  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById("copiedMsg");
    if (el) { el.textContent = "✅ Copied! Now paste it on Reddit."; setTimeout(() => { if(el) el.textContent=""; }, 3000); }
  });
}

document.getElementById("guessInput").addEventListener("keydown", e => { if (e.key === "Enter") makeGuess(); });
document.getElementById("guessInput").addEventListener("input", function () {
  const val = this.value.trim().toLowerCase();
  const dd = document.getElementById("dropdown");
  if (!val || val.length < 2) { dd.style.display = "none"; return; }
  const matches = PLAYERS.filter(c => c.name.toLowerCase().includes(val)).slice(0, 7);
  if (!matches.length) { dd.style.display = "none"; return; }
  dd.innerHTML = matches.map(c => `<div onclick="selectPlayer('${c.name.replace(/'/g, "\\'")}')"><span>${c.name}</span><span class="dc">${c.country}</span></div>`).join("");
  dd.style.display = "block";
});
function selectPlayer(name) {
  document.getElementById("guessInput").value = name;
  document.getElementById("dropdown").style.display = "none";
}
document.addEventListener("click", e => { if (!e.target.closest(".autocomplete")) document.getElementById("dropdown").style.display = "none"; });
loadGame();
</script>
